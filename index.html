<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture ideas before they disappear.</p>
  </header>
  <main>
    <section aria-labelledby="add-heading">
      <h2 id="add-heading">Add a note</h2>
      <form id="note-form">
        <label for="note-input">Note</label>
        <input id="note-input" type="text" maxlength="200" placeholder="Write your note...">
        <label for="note-category">Category</label>
        <select id="note-category">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
        </select>
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>
    <section aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your notes</h2>
      <label for="search-input">Search notes</label>
      <input id="search-input" type="search" placeholder="Search your notes...">
      <p id="note-count">You have no notes yet.</p>
      <button id="clear-all" type="button">Clear all</button>
      <ul id="notes-list"></ul>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 QuickNotes</p>
  </footer>
</body>
</html>
